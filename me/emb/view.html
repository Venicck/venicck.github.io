<html>
  <head>
    <!-- A-FrameをCDNから読み込む -->
    <script src="https://aframe.io/releases/1.0.3/aframe.min.js"></script>
    <!-- aframe-orbit-controlsをCDNから読み込む -->
    <script src="https://unpkg.com/aframe-orbit-controls@1.2.0/dist/aframe-orbit-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="./script.js"></script>
  </head>
<body>
  <a-scene vr-mode-ui="enabled: false">
    <a-entity camera orbit-controls="target: 0 4 0; maxPolarAngle:179.9; minDistance: 3; maxDistance: 15; initialPosition: 0 0 20"></a-entity>
    
    <a-gltf-model  id="model" src="./model/lp.glb"  position="0 -5 0" rotation="0 0 0" scale="10 10 10" animation-mixer="clip: stand"></a-gltf-model>
    
    <!-- 背景色-->
    <a-sky color="#5c5c5c"></a-sky>
  </a-scene>
  <header>
    <div class="row">
      <button class="item" title="通常" onclick="changeModel(0)"><img src="./img/default.png" alt="通常"></button>
      <div class="sep"></div>
      <button class="item" title="ブルスク版" onclick="changeModel(1)"><img src="./img/bsod.png" alt="ブルスク版"></button>
      <div class="sep"></div>
      <button class="item" title="ダーク版" onclick="changeModel(2)"><img src="./img/dark.png" alt="ダーク版"></button>
    </div>
    <div class="row">
      <button class="item" title="起立" onclick="changeEmotion(0)"><img src="./img/stand.png" alt="起立"></button>
      <div class="sep"></div>
      <button class="item" title="挨拶" onclick="changeEmotion(1)"><img src="./img/greet.png" alt="挨拶"></button>
      <div class="sep"></div>
      <button class="item" title="落下" onclick="changeEmotion(2)"><img src="./img/fall.png" alt="落下"></button>
    </div>
  </header>
  <footer>
    <button class="item" title="アバターを使った文字PVを見る" onclick="toggleVideo()">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#424242"><path d="m380-300 280-180-280-180v360ZM160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm0-80h640v-480H160v480Zm0 0v-480 480Z"/></svg>
    </button>
  </footer>
  <div class="yt-video">
    <iframe src="https://www.youtube.com/embed/a_BkKYpfN18?si=B8kzvp0qiRp9tgDR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</body>
</html>
